<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publications from HAL</title>
    <style>
      html, body { margin: 0; background: transparent; }
      body {
        padding: 8px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        /* Text outside the cards (group headings, credit) inherits this color. */
        color: #1a1a1a;
      }
      body[data-theme="dark"] { color: #e6edf3; }
      @media (prefers-color-scheme: dark) {
        body[data-theme="auto"] { color: #e6edf3; }
      }
      .notice { margin: 0; padding: 16px; border: 1px dashed currentColor; border-radius: 6px; font-size: 0.95rem; }
      .notice code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    </style>
  </head>
  <body>
    <div id="publications"></div>
    <p class="notice" id="notice" hidden>
      Nothing to show yet: add <code>idHal</code>, <code>orcid</code>, <code>collection</code>, <code>structId</code>,
      <code>search</code> or <code>q</code> to this page's address, for example <code>embed.html?idHal=jdupont</code>.
    </p>

    <script type="module">
      import { HalSearch, hasQueryCriterion, parseUrlParams } from './hal-search.es.js';

      // Same public URL scheme as the web component and the SVG service. Legacy `uid` (raw query)
      // and `type` (output) still work; invalid values are dropped by parseUrlParams.
      const state = parseUrlParams(new URLSearchParams(location.search));
      document.body.dataset.theme = state.theme ?? 'light';
      if (state.locale) document.documentElement.lang = state.locale;
      if (state.title) document.title = state.title;

      if (!hasQueryCriterion(state.query)) {
        // Never fall back to the whole archive.
        document.getElementById('notice').hidden = false;
      } else {
        const hs = new HalSearch({
          container: '#publications',
          locale: state.locale,
          output: state.output,
          lvl: state.lvl,
          rows: state.rows,
          sort: state.sort,
          filters: state.filters,
          theme: state.theme,
          backgroundColor: state.backgroundColor,
          textColor: state.textColor,
          mainColor: state.mainColor,
          groupBy: state.groupBy,
          highlightAuthors: state.highlightAuthors,
          maxAuthors: state.maxAuthors,
          showCredit: state.showCredit,
          title: state.title,
        });
        hs.search({ query: state.query, page: state.page });
      }
    </script>
  </body>
</html>
